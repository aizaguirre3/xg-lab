name: CI

# Unit tests only. Nothing here downloads StatsBomb or Metrica data: the R
# tests use the two tiny fixtures under tests/fixtures/ and the Python parity
# tests skip cleanly when data/parity/ is absent.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (varlab)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install varlab and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run pytest
        run: pytest tests/python -q

  r:
    name: R (testthat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Same package list as docs/HANDOFF.md section 3 (mgcv ships with R).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::ggplot2
            any::lme4
            any::xgboost
            any::here
            any::testthat

      - name: Run testthat
        run: Rscript -e 'source("R/utils.R"); for (f in list.files("R", pattern = "^0[6-9]|^1[0-2]", full.names = TRUE)) source(f); testthat::test_dir("tests")'

  # VAR-Lab M4 vision scaffold: loaders, GS-HOTA adapter and the CPU smoke
  # pipeline on a synthetic clip. Installs only requirements-vision-test.txt
  # (numpy/pandas/scipy/OpenCV/supervision/trackers, about a minute); the full
  # requirements-vision.txt (torch + CUDA wheels, model weights) stays out of CI.
  vision:
    name: Python 3.12 (varlab_vision, CPU subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vision-test.txt

      - name: Install the CPU test subset (no torch, no weights)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-vision-test.txt

      - name: Run the vision tests
        run: pytest tests/vision -q
