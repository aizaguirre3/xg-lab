[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "varlab"
version = "0.1.0"
description = "Calibration and evaluation helpers for xg-lab, ported from the R toolkit (log loss, Brier decomposition, ECE, reliability bins, leakage-safe isotonic recalibration, grouped folds, abstention curves)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["varlab", "varlab_vision"]  # varlab_vision deps: requirements-vision.txt

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
